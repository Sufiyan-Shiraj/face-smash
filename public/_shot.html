<!doctype html><html><head><meta charset=utf-8><style>body{margin:0;background:#888}</style></head><body>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.186.0/examples/jsm/"}}</script>
<script type=module>
import * as THREE from 'three'
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js'
const S=1024
const r=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true})
r.setSize(S,S); document.body.appendChild(r.domElement)
const sc=new THREE.Scene(); sc.background=new THREE.Color(0xf2f2f2)
sc.add(new THREE.HemisphereLight(0xffffff,0x9090a0,2.2))
const k=new THREE.DirectionalLight(0xffffff,2.0); k.position.set(1.2,1.6,2.2); sc.add(k)
const f=new THREE.DirectionalLight(0xffffff,0.7); f.position.set(-1.5,0.4,1.2); sc.add(f)
new GLTFLoader().load('/models/head_opt.glb',(g)=>{
  sc.add(g.scene)
  const b=new THREE.Box3().setFromObject(g.scene), sz=b.getSize(new THREE.Vector3()), c=b.getCenter(new THREE.Vector3())
  const m=Math.max(sz.x,sz.y,sz.z)
  const cam=new THREE.PerspectiveCamera(35,1,0.01,100)
  cam.position.set(c.x, c.y+m*0.04, c.z+m*1.85); cam.lookAt(c.x,c.y+m*0.02,c.z)
  r.render(sc,cam)
  window.__png = r.domElement.toDataURL('image/jpeg', 0.92)
  try { localStorage.setItem('__testface', window.__png) } catch(e) { window.__lsErr = String(e) }
  window.__ready = true
},undefined,e=>{window.__err=String(e)})
</script></body></html>
